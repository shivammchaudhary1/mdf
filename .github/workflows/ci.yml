name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare CI frontend production env
        shell: bash
        run: |
          cat > apps/web/.env.prod <<'EOF'
          NEXT_PUBLIC_API_URL=https://api.example.invalid/api/v1
          NEXT_PUBLIC_SITE_URL=https://example.invalid
          EOF
      - name: Quality gate
        run: npm run check
      - name: Isolated integration tests
        run: npm run test:integration
