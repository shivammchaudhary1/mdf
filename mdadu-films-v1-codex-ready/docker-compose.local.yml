# Optional local fallback for Docker kernels incompatible with MongoDB 8.
# Separate volume: never opens an existing MongoDB 8 data directory in MongoDB 7.
services:
  mongo:
    image: mongo:7.0
    container_name: mdadu-films-mongo-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mdadu_mongo7_local_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  mdadu_mongo7_local_data:
